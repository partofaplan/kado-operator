# Prometheus and Grafana — somewhere to point an application's /metrics
# endpoint while you develop a dashboard or an alert.
#
#   kubectl apply -f examples/observability.yaml
#   kubectl -n observability port-forward svc/grafana 3000:3000     # admin / dev
#   kubectl -n observability port-forward svc/prometheus 9090:9090
#
# Both run on their built-in configuration. Prometheus scrapes only itself
# until you give it a config of your own — this operator mounts no config
# files, so add scrape targets by baking them into an image or by pointing a
# sidecar-free Prometheus at a remote-write endpoint.
apiVersion: devenv.aviture.dev/v1alpha1
kind: DevEnvironment
metadata:
  name: observability
  namespace: default
spec:
  owner: platform-team

  storage:
    size: 2Gi
    # Prometheus runs as `nobody` (65534), so without fsGroup it cannot write
    # the volume on any provisioner that presents the root as root:root 0755 —
    # most CSI drivers, EBS, GCE PD — and panics at startup with "Unable to
    # create mmap-ed active query log". fsGroup makes the volume group-owned by
    # that GID and group-writable.
    #
    # A cluster whose StorageClass happens to mount 0777, such as k3s
    # local-path, works either way, which is exactly why this is easy to miss
    # until someone deploys on a second cluster.
    fsGroup: 65534

  config:
    LOG_LEVEL: debug
    ENVIRONMENT: development

  services:
    - name: prometheus
      image: prom/prometheus:v3.1.0
      port: 9090
      # The only service mounting the shared volume, so it is the only pod
      # fsGroup is applied to. Grafana runs as uid 472 and would need its own.
      mountPath: /prometheus
      readinessProbe: {}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 500m, memory: 1Gi }

    - name: grafana
      image: grafana/grafana:11.4.0
      port: 3000
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: dev
        # Off by default so the dashboard opens straight onto the UI rather
        # than a login page. Drop this line to exercise the login flow.
        GF_AUTH_ANONYMOUS_ENABLED: "true"
      readinessProbe: {}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
