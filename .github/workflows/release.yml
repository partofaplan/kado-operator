name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: docker.io/partofaplan/kado-operator
  # Not a secret: this namespace is public and already appears in IMAGE.
  DOCKERHUB_USER: partofaplan

jobs:
  release:
    name: Build, push and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog can diff against the previous tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag that cannot pass its own tests must not become a release.
      - name: Run tests
        run: make test

      # Required for the linux/arm64 leg of the multi-arch build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 publishes 1.2.3, 1.2 and 1, so consumers can track a patch line
      # or a major line. `latest` moves only on a full release — the
      # `latest=false` guard keeps a prerelease like v1.2.3-rc1 from claiming
      # it, which would hand every `docker pull ...:latest` an unstable build.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=kado-operator
            org.opencontainers.image.description=Operator for provisioning dev environments in Kubernetes

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build install manifest
        run: make build-installer IMG=${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Package and push Helm chart
        run: |
          VERSION="${{ github.ref_name }}"
          make helm-crds
          helm package charts/kado-operator \
            --version "${VERSION#v}" \
            --app-version "${VERSION}" \
            --destination dist/
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io \
            --username "${{ env.DOCKERHUB_USER }}" --password-stdin
          helm push "dist/kado-operator-${VERSION#v}.tgz" oci://registry-1.docker.io/partofaplan

      - name: Generate release notes
        run: |
          VERSION="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          {
            echo "# kado-operator ${VERSION}"
            echo
            echo "## Install"
            echo '```bash'
            echo "helm install kado-operator oci://registry-1.docker.io/partofaplan/kado-operator \\"
            echo "  --version ${VERSION#v} --namespace kado-operator-system --create-namespace"
            echo '```'
            echo
            echo "Or apply the bundled manifest:"
            echo '```bash'
            echo "kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${VERSION}/install.yaml"
            echo '```'
            echo
            echo "## Container image"
            echo '```'
            echo "${{ env.IMAGE }}:${VERSION}"
            echo '```'
            echo
            echo "Pinned by digest:"
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "## Changes"
            if [ -n "$PREV" ]; then
              git log --pretty='- %s (%h)' "${PREV}..${VERSION}"
            else
              git log --pretty='- %s (%h)' "${VERSION}"
            fi
          } > RELEASE.md
          cat RELEASE.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          files: |
            dist/install.yaml
            dist/kado-operator-*.tgz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
