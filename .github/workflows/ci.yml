name: CI

on:
  push:
    branches: [ develop, main, 'release/**', 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ develop, main ]

# A new push to a branch makes the in-flight run for that branch obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/partofaplan/kado-operator
  # Not a secret: this namespace is public and already appears in IMAGE.
  DOCKERHUB_USER: partofaplan


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.0
          args: --timeout=5m

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A stale zz_generated.deepcopy.go or CRD manifest means the cluster gets
      # a schema that does not match the Go types, so fail loudly here rather
      # than at apply time.
      - name: Regenerate manifests and deepcopy
        run: make manifests generate

      - name: Fail if regeneration changed anything
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit the result."
            git --no-pager diff
            exit 1
          fi

  test:
    name: Unit & envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 'make test' provisions the envtest control-plane binaries and sets
      # KUBEBUILDER_ASSETS; a bare 'go test ./...' would fail without them.
      - name: Run tests
        run: make test

      - name: Report coverage
        run: go tool cover -func=cover.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  publish:
    name: Build & publish image
    needs: [ lint, test, generated ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # QEMU registers the binfmt handlers buildx needs to *probe* foreign
      # platforms. The build itself still cross-compiles natively, because the
      # Dockerfile pins its builder stage to $BUILDPLATFORM.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we actually intend to push. Pull requests from
      # forks cannot read secrets, so those runs build without pushing.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Branch pushes get a moving tag naming the branch, plus an immutable
      # sha tag so any build you tested can be pinned exactly. `latest` is
      # deliberately NOT set here — it belongs to released versions and is
      # published by release.yml on a v* tag.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=kado-operator
            org.opencontainers.image.description=Operator for provisioning dev environments in Kubernetes

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # Multi-arch only when we publish. A pull request builds one
          # architecture: it is faster feedback, and a multi-platform build
          # with no exporter has no artifact to show for the extra minutes.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise published image
        if: github.event_name == 'push'
        run: |
          {
            echo "### Image published to Docker Hub"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull the exact build this run tested:"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
