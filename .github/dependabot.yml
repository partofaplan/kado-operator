# Actions are pinned by full commit SHA (#17), which is immutable and therefore
# never picks up upstream fixes on its own. Dependabot reads the trailing
# `# vX.Y.Z` comment, so it can bump both the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Routine bumps batch into one PR; majors do not (#41). An action's major
      # can change its inputs, outputs or runtime with no code change of ours —
      # the first, ungrouped run moved all 11 actions from node20 to node24,
      # which needs Actions Runner >= 2.327.1 and would have broken the
      # self-hosted job on an older one. Nothing in that PR said so.
      #
      # Grouped, the reviewable unit is all-or-nothing and a red pipeline has
      # eleven suspects. An update that does not match the group is not
      # dropped — Dependabot raises it on its own, so each major becomes a
      # small diff that can be read, and reverted, by itself.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
