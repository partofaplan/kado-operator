# This rule is not used by the project kado-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the devenv.aviture.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kado-operator
    app.kubernetes.io/managed-by: kustomize
  name: devenvironment-editor-role
rules:
- apiGroups:
  - devenv.aviture.dev
  resources:
  - devenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devenv.aviture.dev
  resources:
  - devenvironments/status
  verbs:
  - get
